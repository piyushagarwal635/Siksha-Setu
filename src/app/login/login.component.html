<div class="login-host">
  <div class="login-card">

    <!-- Brand Header -->
    <div class="brand-header">
      <img src="/Divya-logo.png" alt="Divya Mitra Logo" class="brand-logo" />
      <div style="display: flex; align-items: center; justify-content: center; height: 70px; margin: 10px 0;">
        <img src="/divyamitra-text-logo-removebg-preview.png" alt="Divya Mitra" style="height: 100%; width: auto; display: block; border: none; border-radius: 0; box-shadow: none; background: transparent;">
      </div>
      <p class="brand-subtitle">Sign in to continue your journey</p>
    </div>

    <!-- Sign In Form -->
    <form [formGroup]="signInForm" (ngSubmit)="onSignIn()" *ngIf="!isForgotPasswordActive" id="signin-form" novalidate>

      <!-- Error Banner -->
      <div *ngIf="showSignInError" class="alert-banner" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <strong>Error:</strong>&nbsp;{{ signInErrorMessage }}
        <button type="button" (click)="showSignInError = false" class="alert-close">&times;</button>
      </div>

      <div class="input-group-custom">
        <label class="form-input-label" for="signin-id">
          <i class="bi bi-person-fill"></i> Disability ID / Username
        </label>
        <input type="text" id="signin-id" placeholder="Enter ID or Username" formControlName="disabilityId" required />
        <div *ngIf="signInForm.get('disabilityId')?.touched && signInForm.get('disabilityId')?.invalid"
          class="validation-message">
          Disability ID or Username is required.
        </div>
      </div>

      <div class="input-group-custom">
        <label class="form-input-label" for="signin-pass">
          <i class="bi bi-lock-fill"></i> Password
        </label>
        <input type="password" id="signin-pass" placeholder="Enter Password" formControlName="pass"
          (focus)="onPasswordFocus()" (blur)="onPasswordBlur()" required />
        <div *ngIf="signInForm.get('pass')?.touched && signInForm.get('pass')?.invalid" class="validation-message">
          Password is required.
        </div>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="remember-row">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember-me" formControlName="rememberMe" aria-label="Remember Me" />
          <label class="form-check-label" for="remember-me">Remember Me</label>
        </div>
        <a (click)="toggleForgotPassword(true)" id="forgot-password-link" class="forgot-link">Forgot password?</a>
      </div>

      <div class="form-actions-row">
        <button type="submit" id="signin-submit" class="btn btn-submit-3d" [disabled]="isLoading">
          <span *ngIf="!isLoading"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</span>
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <span *ngIf="isLoading"> Loading...</span>
        </button>
        <button type="button" class="btn btn-reset-3d" (click)="onreset()" [disabled]="isLoading">Reset</button>
      </div>

      <!-- Bottom link to Signup -->
      <br />
      <div class="bottom-link">
        <span>Don't have an account?</span>
        <a routerLink="/signup" id="goto-signup" class="create-account-link">Create one here</a>
      </div>

    </form>

    <!-- Forgot Password Step-by-Step -->
    <div *ngIf="isForgotPasswordActive" class="forgot-wrapper">
      <h2 class="section-title">Reset Password</h2>
      <p class="section-subtitle">Recover your account credentials</p>

      <!-- STEP 1: Enter ID -->
      <div *ngIf="recoveryStep === 1">
        <div class="input-group-custom">
          <label class="form-input-label" for="recovery-id">
            <i class="bi bi-person-fill"></i> Disability ID, Admin ID, or Username
          </label>
          <input type="text" id="recovery-id" placeholder="Enter ID or Username" [(ngModel)]="recoveryUserId"
            required />
        </div>
        <div class="form-actions-row mt-3">
          <button type="button" class="btn btn-submit-3d" (click)="fetchSecurityQuestion()"
            [disabled]="isLoading || !recoveryUserId">
            <span *ngIf="!isLoading">Next <i class="bi bi-arrow-right-short"></i></span>
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status"></span>
          </button>
          <button type="button" class="btn btn-reset-3d" (click)="toggleForgotPassword(false)">Cancel</button>
        </div>
      </div>

      <!-- STEP 2: Security Question -->
      <div *ngIf="recoveryStep === 2">
        <div class="input-group-custom">
          <label class="form-input-label" for="recovery-question">
            <i class="bi bi-shield-lock-fill"></i> Select Your Security Question
          </label>
          <select id="recovery-question" [(ngModel)]="recoveryQuestion" required>
            <option value="" disabled>Choose a Question</option>
            <option *ngFor="let q of recoveryQuestions" [value]="q">{{ q }}</option>
          </select>
        </div>
        <div class="input-group-custom">
          <label class="form-input-label" for="recovery-answer">
            <i class="bi bi-chat-left-dots-fill"></i> Your Answer
          </label>
          <input type="text" id="recovery-answer" placeholder="Enter your answer" [(ngModel)]="recoveryAnswer"
            required />
        </div>
        <div class="input-group-custom">
          <label class="form-input-label" for="recovery-new-pass">
            <i class="bi bi-lock-fill"></i> New Password
          </label>
          <input type="password" id="recovery-new-pass" placeholder="Enter new password (min 8 chars)"
            [(ngModel)]="recoveryNewPassword" required />
        </div>
        <div class="input-group-custom">
          <label class="form-input-label" for="recovery-confirm-pass">
            <i class="bi bi-shield-lock-fill"></i> Confirm Password
          </label>
          <input type="password" id="recovery-confirm-pass" placeholder="Confirm new password"
            [(ngModel)]="recoveryConfirmPassword" required />
        </div>
        <div class="form-actions-row">
          <button type="button" class="btn btn-submit-3d" (click)="resetWithQuestion()"
            [disabled]="isLoading || !recoveryQuestion || !recoveryAnswer || !recoveryNewPassword || !recoveryConfirmPassword">
            <span *ngIf="!isLoading">Reset Password</span>
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status"></span>
          </button>
          <button type="button" class="btn btn-reset-3d" (click)="goToRecoveryStep1()">Back</button>
        </div>
      </div>

      <!-- Back to Sign In link -->
      <br />
      <div class="bottom-link">
        <a (click)="toggleForgotPassword(false)" style="cursor:pointer;" class="create-account-link">
          <i class="bi bi-arrow-left-short"></i> Back to Sign In
        </a>
      </div>
    </div>

  </div>
</div>
